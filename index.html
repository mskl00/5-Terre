let state = {
  questions: [],
  current: 0,
  answers: [],
  totalQuestions: 82,
  startTime: null,
  filterSource: "all"
};

const app = document.getElementById('app');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getFilteredQuestions() {
  if (state.filterSource === "all") return QUESTIONS;
  return QUESTIONS.filter(q => q.source === state.filterSource);
}

function renderStart() {
  app.innerHTML = `
    <div class="start-screen">
      <h2>Benvenuto al Quiz IPMA Livello D</h2>
      <p>82 domande da due fonti ufficiali, randomizzate a ogni sessione.<br>
      Dopo ogni risposta viene mostrata la soluzione con spiegazione.</p>
      <div class="source-tags">
        <span class="source-tag apm">APM Sample Paper — 60 domande</span>
        <span class="source-tag vzpm">VZPM Sample Questions — 22 domande</span>
      </div>
      <div class="config-row">
        <label for="sourceFilter">Fonte:</label>
        <select id="sourceFilter">
          <option value="all">Tutte (82)</option>
          <option value="APM">Solo APM (60)</option>
          <option value="VZPM">Solo VZPM (22)</option>
        </select>
      </div>
      <div class="config-row">
        <label for="numQ">Domande:</label>
        <select id="numQ"></select>
      </div>
      <button class="btn" id="startBtn">Inizia Quiz</button>
    </div>
  `;

  const sourceSelect = document.getElementById('sourceFilter');
  const numSelect = document.getElementById('numQ');

  function updateNumOptions() {
    const src = sourceSelect.value;
    const max = src === "APM" ? 60 : src === "VZPM" ? 22 : 82;
    const opts = [10, 20, 30, 40, 60, 82].filter(n => n <= max);
    if (!opts.includes(max)) opts.push(max);
    opts.sort((a, b) => a - b);
    numSelect.innerHTML = opts.map(n =>
      `<option value="${n}" ${n === max ? 'selected' : ''}>${n}${n === max ? ' (tutte)' : ''}</option>`
    ).join('');
  }

  sourceSelect.onchange = updateNumOptions;
  updateNumOptions();

  document.getElementById('startBtn').onclick = () => {
    state.filterSource = sourceSelect.value;
    const n = parseInt(numSelect.value);
    startQuiz(n);
  };
}

function startQuiz(n) {
  const pool = getFilteredQuestions();
  state.questions = shuffle(pool).slice(0, n).map(q => ({
    ...q,
    shuffledOptions: shuffle(q.options.map((opt, i) => ({ text: opt, originalIndex: i })))
  }));
  state.current = 0;
  state.answers = [];
  state.totalQuestions = n;
  state.startTime = Date.now();
  renderQuestion();
}

function renderQuestion() {
  const q = state.questions[state.current];
  const progress = ((state.current) / state.totalQuestions) * 100;
  const alreadyAnswered = state.answers[state.current] !== undefined;
  const userChoice = state.answers[state.current];
  const badgeClass = q.source === "VZPM" ? "vzpm" : "apm";

  app.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="question-meta">
      <span>Domanda ${state.current + 1} di ${state.totalQuestions}</span>
      <span><span class="badge ${badgeClass}">${q.source}</span> #${q.id}</span>
    </div>
    <div class="question-text">${q.q}</div>
    <div class="options" id="optionsContainer"></div>
    <div id="explanationBox"></div>
    <div class="nav">
      <button class="btn btn-secondary" id="prevBtn" ${state.current === 0 ? 'disabled' : ''}>← Indietro</button>
      <button class="btn" id="nextBtn" ${!alreadyAnswered ? 'disabled' : ''}>
        ${state.current === state.totalQuestions - 1 ? 'Termina →' : 'Avanti →'}
      </button>
    </div>
  `;

  const optsContainer = document.getElementById('optionsContainer');
  const letters = ['A', 'B', 'C', 'D'];

  q.shuffledOptions.forEach((opt, displayIdx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="letter">${letters[displayIdx]}.</span><span>${opt.text}</span>`;

    if (alreadyAnswered) {
      div.classList.add('disabled');
      if (opt.originalIndex === q.correct) div.classList.add('correct');
      if (displayIdx === userChoice && opt.originalIndex !== q.correct) div.classList.add('wrong');
    } else {
      div.onclick = () => handleAnswer(displayIdx);
    }
    optsContainer.appendChild(div);
  });

  if (alreadyAnswered) showExplanation();

  document.getElementById('prevBtn').onclick = () => {
    if (state.current > 0) { state.current--; renderQuestion(); }
  };
  document.getElementById('nextBtn').onclick = () => {
    if (state.current < state.totalQuestions - 1) {
      state.current++;
      renderQuestion();
    } else {
      renderResults();
    }
  };
}

function handleAnswer(displayIdx) {
  state.answers[state.current] = displayIdx;
  renderQuestion();
}

function showExplanation() {
  const q = state.questions[state.current];
  const userChoice = state.answers[state.current];
  const chosenOriginalIdx = q.shuffledOptions[userChoice].originalIndex;
  const isCorrect = chosenOriginalIdx === q.correct;
  const box = document.getElementById('explanationBox');
  const correctLetter = ['A','B','C','D'][q.shuffledOptions.findIndex(o => o.originalIndex === q.correct)];

  box.innerHTML = `
    <div class="explanation ${isCorrect ? 'correct' : 'wrong'}">
      <h3 class="${isCorrect ? 'correct' : 'wrong'}">
        ${isCorrect ? '✓ Risposta corretta!' : '✗ Risposta errata'}
      </h3>
      ${!isCorrect ? `<p style="margin-bottom:10px"><strong>La risposta corretta è: ${correctLetter}</strong></p>` : ''}
      <p>${q.explanation}</p>
    </div>
  `;
}

function renderResults() {
  let correctCount = 0;
  let apmCorrect = 0, apmTotal = 0, vzpmCorrect = 0, vzpmTotal = 0;
  state.questions.forEach((q, i) => {
    const userAns = state.answers[i];
    const isCorrect = userAns !== undefined && q.shuffledOptions[userAns].originalIndex === q.correct;
    if (isCorrect) correctCount++;
    if (q.source === "APM") { apmTotal++; if (isCorrect) apmCorrect++; }
    if (q.source === "VZPM") { vzpmTotal++; if (isCorrect) vzpmCorrect++; }
  });
  const total = state.totalQuestions;
  const pct = Math.round((correctCount / total) * 100);
  const passed = pct >= 65;
  const elapsed = Math.round((Date.now() - state.startTime) / 60000);

  let breakdownHtml = '';
  if (apmTotal > 0 && vzpmTotal > 0) {
    breakdownHtml = `
      <div style="display:flex;gap:16px;justify-content:center;margin-bottom:20px;flex-wrap:wrap">
        <div style="padding:10px 16px;border-radius:8px;background:#e0ecff;font-size:14px">
          <strong>APM:</strong> ${apmCorrect}/${apmTotal} (${Math.round(apmCorrect/apmTotal*100)}%)
        </div>
        <div style="padding:10px 16px;border-radius:8px;background:#e6f7ec;font-size:14px">
          <strong>VZPM:</strong> ${vzpmCorrect}/${vzpmTotal} (${Math.round(vzpmCorrect/vzpmTotal*100)}%)
        </div>
      </div>
    `;
  }

  let reviewHtml = '<div class="review-list"><h3 style="margin-bottom:10px;color:#1e3c72">Riepilogo domande</h3>';
  state.questions.forEach((q, i) => {
    const userAns = state.answers[i];
    const answered = userAns !== undefined;
    const isCorrect = answered && q.shuffledOptions[userAns].originalIndex === q.correct;
    reviewHtml += `
      <div class="review-item ${answered ? (isCorrect ? 'correct-row' : 'wrong-row') : ''}">
        <div class="q-title">
          <span class="badge ${q.source === 'VZPM' ? 'vzpm' : 'apm'}" style="font-size:10px;margin-right:4px">${q.source}</span>
          ${isCorrect ? '✓' : (answered ? '✗' : '—')}
          ${q.q.substring(0, 85)}${q.q.length > 85 ? '...' : ''}
        </div>
      </div>
    `;
  });
  reviewHtml += '</div>';

  app.innerHTML = `
    <div class="results">
      <h2>Quiz completato!</h2>
      <div class="score-circle">
        <div class="score-number">${correctCount}/${total}</div>
        <div class="score-total">risposte corrette</div>
      </div>
      <div class="score-pct">${pct}%</div>
      ${breakdownHtml}
      <div class="verdict ${passed ? 'pass' : 'fail'}">
        ${passed ? '🎉 Complimenti! Hai superato la soglia del 65%' : '📚 Sotto la soglia del 65% — continua a studiare!'}
        <br><small>Tempo impiegato: ${elapsed} minuti</small>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px">
        <button class="btn" id="restartBtn">Nuovo Quiz</button>
        <button class="btn btn-secondary" id="reviewBtn">Rivedi risposte</button>
      </div>
      ${reviewHtml}
    </div>
  `;

  document.getElementById('restartBtn').onclick = renderStart;
  document.getElementById('reviewBtn').onclick = () => {
    state.current = 0;
    renderQuestion();
  };
}

renderStart();
</script>
</body>
</html>
