<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 860px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    padding: 28px 30px;
    text-align: center;
  }
  header h1 { font-size: 26px; margin-bottom: 6px; }
  header p { opacity: 0.9; font-size: 14px; }
  .main { padding: 30px; }

  .start-screen h2 { color: #1e3c72; margin-bottom: 16px; font-size: 22px; }
  .start-screen p { color: #555; margin-bottom: 24px; line-height: 1.6; }

    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .config-row label { color: #555; font-weight: 500; }

    padding: 10px 14px;

    border: 2px solid #ddd;

  }
  .btn {
    background: linear-gradient(135deg, #1e3c72, #2a5298);

    border: none;
    padding: 14px 32px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;

  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: #f0f0f0;
    color: #333;
  }
  .btn-secondary:hover { background: #e0e0e0; box-shadow: none; }
  .progress-bar {
    background: #f0f0f0;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1e3c72, #2a5298);
    transition: width 0.3s;
  }
  .question-meta {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .question-text {
    font-size: 18px;
    line-height: 1.5;
    color: #1e3c72;
    margin-bottom: 22px;
    font-weight: 600;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px 18px;

    transition: all 0.2s;
    background: #fff;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    line-height: 1.4;
  }
  .option:hover:not(.disabled) { border-color: #2a5298; background: #f5f8ff; }
  .option.disabled { cursor: default; }
  .option .letter {
    font-weight: 700;
    color: #2a5298;
    min-width: 24px;
  }
  .option.correct {
    border-color: #28a745;
    background: #e6f7ec;
  }
  .option.correct .letter { color: #28a745; }
  .option.wrong {
    border-color: #dc3545;
    background: #fbeaec;
  }
  .option.wrong .letter { color: #dc3545; }
  .explanation {
    margin-top: 20px;
    padding: 18px;
    border-radius: 10px;
    background: #f8f9fc;
    border-left: 4px solid #2a5298;
  }
  .explanation.correct { border-left-color: #28a745; background: #e6f7ec; }
  .explanation.wrong { border-left-color: #dc3545; background: #fbeaec; }
  .explanation h3 { margin-bottom: 8px; font-size: 16px; }
  .explanation h3.correct { color: #28a745; }
  .explanation h3.wrong { color: #dc3545; }
  .explanation p { color: #444; line-height: 1.6; font-size: 15px; }
  .nav {
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .results {
    text-align: center;
    padding: 30px 20px;
  }
  .results h2 { color: #1e3c72; font-size: 28px; margin-bottom: 20px; }
  .score-circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 26px;
    box-shadow: 0 10px 30px rgba(30,60,114,0.3);
  }
  .score-circle .score-number { font-size: 48px; font-weight: 700; }
  .score-circle .score-total { opacity: 0.9; font-size: 16px; }
  .score-pct { font-size: 22px; color: #2a5298; font-weight: 600; margin-bottom: 24px; }
  .verdict { font-size: 18px; margin-bottom: 24px; padding: 14px; border-radius: 10px; }
  .verdict.pass { background: #e6f7ec; color: #1b7a35; border: 2px solid #28a745; }
  .verdict.fail { background: #fbeaec; color: #a02030; border: 2px solid #dc3545; }
  .review-list {
    text-align: left;
    margin-top: 24px;
    max-height: 400px;
    overflow-y: auto;
    padding: 10px;
    border: 1px solid #eee;
    border-radius: 10px;
  }
  .review-item {
    padding: 10px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .review-item:last-child { border-bottom: none; }
  .review-item .q-title { font-weight: 600; color: #1e3c72; margin-bottom: 4px; }
  .review-item.correct-row { background: #f0faf3; }
  .review-item.wrong-row { background: #fcf3f4; }
  footer {
    text-align: center;
    padding: 16px;
    color: #888;
    font-size: 13px;
    border-top: 1px solid #eee;
  }
  @media (max-width: 600px) {
    .main { padding: 20px; }
    header h1 { font-size: 20px; }
    .question-text { font-size: 16px; }
    .option { padding: 12px 14px; font-size: 14px; }
    .score-circle { width: 140px; height: 140px; }
    .score-circle .score-number { font-size: 36px; }
  }

<body>
<div class="container">
  <header>
    <h1>Quiz IPMA Livello D – APM</h1>
    <p>Simulazione d'esame con domande randomizzate</p>
  </header>
  <div class="main" id="app"></div>
  <footer>60 domande disponibili • Soglia di sufficienza: 65%</footer>
</div>

<script>
// ============================================================
// BANCA DOMANDE - IPMA Livello D / APM
// Risposte corrette basate su APM Body of Knowledge e ICB4
// ============================================================
const QUESTIONS = [
  {
    id: 1,
    q: "Un project manager può assumersi la responsabilità delle proprie azioni:",
    options: [
      "modificando le condizioni contrattuali con un fornitore.",
      "consultando gli stakeholder interni senior.",
      "riallineando la propria job description alle attività effettive.",
      "assumendosi la titolarità sia dei risultati positivi sia di quelli negativi."
    ],
    correct: 3,
    explanation: "L'accountability (responsabilità personale) nel project management si dimostra assumendo la titolarità (ownership) integrale di tutti gli esiti del progetto, positivi o negativi. Le altre opzioni sono manovre per evitare la responsabilità o attività operative scollegate dal concetto etico di assunzione di responsabilità personale."
  },
  {
    id: 2,
    q: "Quale tra i seguenti NON è un beneficio della produzione di una visione d'insieme ad alto livello del progetto?",
    options: [
      "Ruoli e responsabilità uniformi",
      "Pianificazione limitata",
      "Terminologia coerente",
      "Documentazione standard"
    ],
    correct: 1,
    explanation: "Una visione d'insieme ad alto livello serve proprio a supportare una pianificazione completa, non 'limitata'. Uniformità di ruoli, coerenza terminologica e documentazione standard sono invece benefici diretti. 'Pianificazione limitata' è un effetto negativo, non un beneficio."
  },
  {
    id: 3,
    q: "Qual è il modo migliore con cui un project manager potrebbe sviluppare e ottenere l'accordo sul piano di progetto?",
    options: [
      "Usare una comunicazione efficace",
      "Usare il transition management",
      "Adottare uno stile di management proattivo",
      "Adottare uno stile di management reattivo"
    ],
    correct: 0,
    explanation: "Secondo l'APM BoK, l'accordo sul piano di progetto richiede negoziazione, coinvolgimento e allineamento degli stakeholder: tutti elementi che dipendono direttamente da una comunicazione efficace. Transition management e stili manageriali sono strumenti complementari ma non il veicolo primario del consenso sul piano."
  },
  {
    id: 4,
    q: "Nel valutare l'uso dei fattori critici di successo, quale delle seguenti affermazioni dimostra che essi vengono utilizzati correttamente?",
    options: [
      "I fattori critici di successo rimangono fissi per tutta la durata del progetto.",
      "I fattori critici di successo misurano se il progetto è in anticipo e/o in ritardo rispetto alla performance.",
      "I fattori critici di successo derivano dai KPI per misurare se il progetto sta raggiungendo gli obiettivi strategici.",
      "I fattori critici di successo sono direttamente allineati sia agli obiettivi organizzativi sia a quelli di progetto."
    ],
    correct: 3,
    explanation: "I Critical Success Factors (CSF) devono essere allineati sia agli obiettivi organizzativi sia a quelli di progetto per garantire coerenza strategica. Non sono fissi (evolvono), non misurano tempi (quello sono i KPI), e sono i KPI a derivare dai CSF, non viceversa."
  },
  {
    id: 5,
    q: "Quale dei seguenti comportamenti del project manager ha maggiori probabilità di favorire una comunicazione aperta?",
    options: [
      "Coinvolgere gli stakeholder in una comunicazione bidirezionale",
      "Creare un piano di comunicazione di progetto",
      "Condurre briefing del team di progetto",
      "Parlare con i membri del team di progetto"
    ],
    correct: 0,
    explanation: "La comunicazione aperta richiede bidirezionalità: ascolto attivo e possibilità di feedback. Piani, briefing e semplici conversazioni unidirezionali (broadcast) non garantiscono l'apertura necessaria a far emergere informazioni, preoccupazioni e idee dagli stakeholder."
  },
  {
    id: 6,
    q: "Il configuration management contribuisce alla configurazione dell'ambito:",
    options: [
      "assicurando che i costi di progetto siano controllati.",
      "minimizzando carenze, errori e ampliamenti indesiderati dell'ambito.",
      "impedendo modifiche all'ambito del progetto.",
      "controllando le modifiche al piano di project management."
    ],
    correct: 1,
    explanation: "Il configuration management garantisce tracciabilità e integrità dei deliverable, minimizzando errori, omissioni e scope creep. Non impedisce le modifiche (le gestisce in modo controllato), non riguarda direttamente i costi né l'intero piano di PM, ma specificamente la baseline di configurazione dei deliverable."
  },
  {
    id: 7,
    q: "Che cosa deve fare un project manager quando assegna le priorità e decide i requisiti e i criteri di accettazione di un progetto?",
    options: [
      "Documentare e concordare la gerarchia degli obiettivi di progetto",
      "Documentare e concordare i bisogni e i requisiti dello sponsor",
      "Documentare e concordare i bisogni e i requisiti degli stakeholder",
      "Documentare e concordare le lesson learned"
    ],
    correct: 2,
    explanation: "I requisiti e i criteri di accettazione derivano da TUTTI gli stakeholder rilevanti, non solo dallo sponsor. Limitarsi allo sponsor escluderebbe utenti finali, team operativi e regolatori. La gerarchia degli obiettivi e le lesson learned sono correlate ma non sono ciò che si documenta specificamente per i requisiti."
  },
  {
    id: 8,
    q: "Quale delle seguenti spiega meglio perché un project manager dovrebbe affrontare le proprie carenze personali e professionali?",
    options: [
      "Affrontare le carenze personali e professionali porterà sempre al completamento delle attività.",
      "Affrontare le carenze personali e professionali dovrebbe rimuovere gli ostacoli al successo professionale.",
      "Affrontare le carenze personali e professionali porterà sempre al successo professionale.",
      "Affrontare le carenze personali e professionali dovrebbe dimostrare assunzione di responsabilità rispetto ai problemi."
    ],
    correct: 1,
    explanation: "Affrontare le proprie carenze è un'azione formativa che rimuove ostacoli al successo, ma non lo garantisce automaticamente. Le opzioni con 'sempre' sono troppo assolute (nessuno sviluppo garantisce il successo). L'opzione D confonde 'affrontare carenze' con 'assunzione di responsabilità per problemi', che sono concetti distinti."
  },
  {
    id: 9,
    q: "Che cosa potrebbe fare il project manager per ottenere al meglio un consenso iniziale sul progetto?",
    options: [
      "Organizzare e facilitare un workshop di avvio del progetto",
      "Comunicare a tutti i membri del team i loro ruoli",
      "Produrre un registro dei rischi",
      "Iniziare il prima possibile per risparmiare tempo"
    ],
    correct: 0,
    explanation: "Il kick-off workshop è lo strumento per eccellenza per costruire consenso iniziale: riunisce stakeholder chiave, chiarisce obiettivi, ruoli, rischi e aspettative in modo collaborativo. Comunicare ruoli o produrre un risk register sono attività successive; iniziare senza consenso è controproducente."
  },
  {
    id: 10,
    q: "Quale delle seguenti affermazioni, relativa al modo in cui un soggetto responsabile valuta e seleziona potenziali fornitori, è vera?",
    options: [
      "Fa in modo che la prima risposta ottenga il punteggio più alto.",
      "Fa in modo che la proposta meno costosa ottenga il punteggio più alto.",
      "Definisce e applica una serie di passaggi logici nel processo di selezione.",
      "Sviluppa i criteri di selezione al ricevimento delle risposte alla gara."
    ],
    correct: 2,
    explanation: "Una selezione responsabile richiede un processo strutturato, trasparente e ripetibile definito PRIMA della gara. Dare priorità a rapidità o prezzo viola i principi di procurement; definire i criteri a posteriori è manipolativo e non etico."
  },
  {
    id: 11,
    q: "L'allineamento di un progetto alla mission e alla vision dell'organizzazione e la conformità ai vincoli e agli obiettivi organizzativi possono essere efficacemente ottenuti mediante:",
    options: [
      "la definizione di un budget di progetto dettagliato.",
      "l'uso di sistemi di controllo gestionale diagnostici.",
      "lo sviluppo di una balanced scorecard.",
      "la redazione di una strategia di comunicazione di progetto."
    ],
    correct: 2,
    explanation: "La Balanced Scorecard (Kaplan & Norton) è lo strumento manageriale specificamente progettato per tradurre mission e vision in obiettivi misurabili lungo quattro prospettive, garantendo allineamento strategico. Budget, sistemi diagnostici e piani di comunicazione sono strumenti tattici, non strategici."
  },
  {
    id: 12,
    q: "Quale delle seguenti domande è la più appropriata che un project manager dovrebbe porsi quando valuta decisioni e azioni?",
    options: [
      "La decisione o l'azione migliorerà la comunicazione?",
      "La decisione o l'azione informerà la strategia del progetto?",
      "La decisione o l'azione spiegherà come raggiungere i target?",
      "La decisione o l'azione metterà a rischio l'obiettivo del progetto?"
    ],
    correct: 3,
    explanation: "La valutazione critica di decisioni si fonda sul principio 'primo, non nuocere': verificare l'impatto sugli obiettivi di progetto è il filtro fondamentale. Migliorare comunicazione, informare la strategia o spiegare target sono elementi secondari rispetto al non compromettere lo scopo primario del progetto."
  },
  {
    id: 13,
    q: "Se il costo di implementazione della risposta non è un problema, qual è la migliore strategia per cogliere le opportunità associate a un rischio positivo?",
    options: [
      "Mitigare l'opportunità",
      "Accettare l'opportunità",
      "Sfruttare l'opportunità",
      "Trasferire l'opportunità"
    ],
    correct: 2,
    explanation: "Per i rischi positivi (opportunità) le strategie sono: Exploit (sfruttare), Enhance (potenziare), Share (condividere), Accept (accettare). 'Sfruttare' è la strategia più aggressiva che assicura al 100% che l'opportunità si realizzi, ideale quando il costo non è un vincolo. 'Mitigare' è per i rischi negativi."
  },
  {
    id: 14,
    q: "Nel determinare i key performance indicators, quale affermazione descrive meglio come possono essere utilizzati?",
    options: [
      "I key performance indicators possono essere utilizzati solo per misurare la puntualità della consegna del progetto.",
      "I key performance indicators possono essere indicatori anticipatori o ritardati, quindi precedere o seguire un evento.",
      "I key performance indicators devono rimanere fissi per tutta la durata del progetto.",
      "I key performance indicators possono essere usati per definire i fattori critici di successo."
    ],
    correct: 1,
    explanation: "I KPI possono essere leading (anticipatori, predittivi) o lagging (ritardati, confermativi). I leading indicators predicono performance future; i lagging misurano risultati già raggiunti. Non sono limitati alla puntualità, non sono fissi e derivano DAI CSF, non li definiscono."
  },
  {
    id: 15,
    q: "Quale delle seguenti NON è una caratteristica di una strategia negoziale?",
    options: [
      "Best Alternative to a Negotiated Agreement (BATNA)",
      "Condizioni di budget e dinamiche politiche",
      "Scenari what-if e bilanciamento del potere",
      "Team negoziale, con ruoli e responsabilità"
    ],
    correct: 1,
    explanation: "La strategia negoziale include BATNA, scenari what-if, bilanciamento del potere, composizione del team negoziale. 'Condizioni di budget e dinamiche politiche' sono elementi di contesto/ambiente in cui la negoziazione avviene, non caratteristiche intrinseche della strategia stessa."
  },
  {
    id: 16,
    q: "Quale delle seguenti è la modalità più probabile con cui un project manager riesaminerebbe i criteri di successo del progetto?",
    options: [
      "Pianificando riunioni mensili per verificare l'avanzamento fino a quel momento",
      "Pianificando riunioni a intervalli regolari per sponsor e stakeholder",
      "Riesaminando settimanalmente il carico di lavoro con il team di progetto",
      "Verificando regolarmente l'avanzamento del progetto rispetto ai criteri di successo formali e informali"
    ],
    correct: 3,
    explanation: "Il riesame dei criteri di successo richiede confronto sistematico tra avanzamento reale e criteri sia formali (documentati) sia informali (aspettative percepite). Riunioni generiche con stakeholder o review del carico di lavoro non sono specificamente review dei criteri di successo."
  },
  {
    id: 17,
    q: "Quale delle seguenti affermazioni è falsa? Quando identifica la necessità di approvvigionare un prodotto o servizio, il project manager:",
    options: [
      "prepara, produce o raccoglie le informazioni necessarie come input.",
      "definisce la documentazione di gara e i criteri di selezione in base ai bisogni.",
      "definisce quale fornitore verrà incaricato del lavoro.",
      "definisce le motivazioni dell'approvvigionamento o della partnership sulla base dei bisogni."
    ],
    correct: 2,
    explanation: "Il project manager NON decide unilateralmente il fornitore: la selezione avviene tramite un processo strutturato di gara con criteri oggettivi, spesso con un comitato di valutazione. Le altre opzioni descrivono correttamente le attività preparatorie all'approvvigionamento."
  },
  {
    id: 18,
    q: "Che cosa dovrebbe essere considerato quando si pianifica un'attività di progetto in cui il pubblico generale potrebbe essere esposto a rischio?",
    options: [
      "Normative in materia di salute e sicurezza",
      "Norme urbanistiche / di pianificazione",
      "Normativa ambientale",
      "Normativa sul lavoro"
    ],
    correct: 0,
    explanation: "Quando il pubblico è esposto a rischi, la normativa Health & Safety è quella primaria e direttamente applicabile. La normativa sul lavoro protegge i lavoratori, quella urbanistica riguarda l'uso del suolo, quella ambientale l'ecosistema: tutte importanti, ma non specifiche per la protezione del pubblico generale."
  },
  {
    id: 19,
    q: "Quale sarebbe l'approccio migliore per un project manager nell'identificare aree di apprendimento e sviluppo personale?",
    options: [
      "Ignorare il feedback del team ma confrontarsi con lo sponsor di progetto",
      "Misurare la propria performance, usare il feedback e poi riesaminare",
      "Identificare corsi di formazione e poi discuterne con il line manager",
      "Aspettare che il line manager comunichi se è necessario migliorare"
    ],
    correct: 1,
    explanation: "Lo sviluppo personale efficace segue un ciclo di auto-consapevolezza: misurare la propria performance, raccogliere feedback da più fonti, riflettere e riesaminare. Ignorare feedback, delegare interamente al line manager o attendere passivamente sono approcci che non dimostrano ownership del proprio sviluppo."
  },
  {
    id: 20,
    q: "Il reporting by exception sull'avanzamento verrebbe di solito utilizzato quando:",
    options: [
      "il team di progetto non ha un leader.",
      "il team di progetto ha contractor esterni.",
      "il team di progetto è esperto.",
      "il team di progetto è di nuova costituzione."
    ],
    correct: 2,
    explanation: "Il reporting by exception (si riporta solo quando si esce da soglie predefinite) presuppone autonomia e capacità di self-management: appropriato per team esperti. Team nuovi, senza leader o misti con contractor richiedono reporting più frequente e strutturato per monitoraggio costante."
  },
  {
    id: 21,
    q: "Come project manager hai identificato un rischio commerciale ad alto impatto, adatto a essere mitigato tramite trasferimento. Quale delle seguenti è l'azione più appropriata per affrontare questo rischio?",
    options: [
      "Trasferire la proprietà del rischio al responsabile salute e sicurezza",
      "Escalare la proprietà del rischio allo sponsor e allo steering committee",
      "Fare in modo che il rischio sia assunto da una compagnia assicurativa",
      "Fare in modo che la proprietà del rischio sia assunta dal risk manager"
    ],
    correct: 2,
    explanation: "Il trasferimento del rischio in senso tecnico significa spostare l'impatto finanziario a una terza parte: l'assicurazione è lo strumento classico. Spostare l'ownership interna (H&S officer, risk manager, sponsor) non è 'trasferimento' ma delega/escalation interna: il rischio resta nell'organizzazione."
  },
  {
    id: 22,
    q: "Identificare le conseguenze sociali e ambientali di un progetto aiuterà a garantire che il progetto:",
    options: [
      "rispetti i principi e gli obiettivi di sostenibilità.",
      "sia allineato ai codici di condotta appropriati.",
      "stabilisca standard professionali pertinenti.",
      "sviluppi i protocolli richiesti in materia di salute e sicurezza."
    ],
    correct: 0,
    explanation: "La triple bottom line (persone, pianeta, profitto) è il cuore della sostenibilità: considerare impatti sociali e ambientali è per definizione garantire aderenza ai principi di sostenibilità. Codici di condotta, standard professionali e H&S sono ambiti correlati ma distinti."
  },
  {

// ============================================================
// LOGICA QUIZ
// ============================================================
let state = {
  questions: [],
  current: 0,
  answers: [],
  totalQuestions: 60,
  startTime: null
};

const app = document.getElementById('app');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderStart() {
  app.innerHTML = `
    <div class="start-screen">
      <h2>Benvenuto al Quiz IPMA Livello D</h2>
      <p>Simulazione d'esame basata sul sample paper APM.<br>
      Ogni sessione propone domande in ordine casuale.<br>
      Dopo ogni risposta viene mostrata la soluzione con spiegazione.</p>
      <div class="config-row">
        <label for="numQ">Numero di domande:</label>
        <select id="numQ">
          <option value="10">10 (prova rapida)</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="60" selected>60 (simulazione completa)</option>
        </select>
      </div>
      <button class="btn" id="startBtn">Inizia Quiz</button>
    </div>
  `;
  document.getElementById('startBtn').onclick = () => {
    const n = parseInt(document.getElementById('numQ').value);
    startQuiz(n);
  };
}

function startQuiz(n) {
  state.questions = shuffle(QUESTIONS).slice(0, n).map(q => ({
    ...q,
    shuffledOptions: shuffle(q.options.map((opt, i) => ({ text: opt, originalIndex: i })))
  }));
  state.current = 0;
  state.answers = [];
  state.totalQuestions = n;
  state.startTime = Date.now();
  renderQuestion();
}

function renderQuestion() {
  const q = state.questions[state.current];
  const progress = ((state.current) / state.totalQuestions) * 100;
  const alreadyAnswered = state.answers[state.current] !== undefined;
  const userChoice = state.answers[state.current];

  app.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="question-meta">
      <span>Domanda ${state.current + 1} di ${state.totalQuestions}</span>
      <span>Originale: #${q.id}</span>
    </div>
    <div class="question-text">${q.q}</div>
    <div class="options" id="optionsContainer"></div>
    <div id="explanationBox"></div>
    <div class="nav">
      <button class="btn btn-secondary" id="prevBtn" ${state.current === 0 ? 'disabled' : ''}>← Indietro</button>
      <button class="btn" id="nextBtn" ${!alreadyAnswered ? 'disabled' : ''}>
        ${state.current === state.totalQuestions - 1 ? 'Termina →' : 'Avanti →'}
      </button>
    </div>
  `;

  const optsContainer = document.getElementById('optionsContainer');
  const letters = ['A', 'B', 'C', 'D'];

  q.shuffledOptions.forEach((opt, displayIdx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="letter">${letters[displayIdx]}.</span><span>${opt.text}</span>`;

    if (alreadyAnswered) {
      div.classList.add('disabled');
      if (opt.originalIndex === q.correct) div.classList.add('correct');
      if (displayIdx === userChoice && opt.originalIndex !== q.correct) div.classList.add('wrong');
    } else {
      div.onclick = () => handleAnswer(displayIdx);
    }
    optsContainer.appendChild(div);
  });

  if (alreadyAnswered) showExplanation();

  document.getElementById('prevBtn').onclick = () => {
    if (state.current > 0) { state.current--; renderQuestion(); }
  };
  document.getElementById('nextBtn').onclick = () => {
    if (state.current < state.totalQuestions - 1) {
      state.current++;
      renderQuestion();
    } else {
      renderResults();
    }
  };
}

function handleAnswer(displayIdx) {
  state.answers[state.current] = displayIdx;
  renderQuestion();
}

function showExplanation() {
  const q = state.questions[state.current];
  const userChoice = state.answers[state.current];
  const chosenOriginalIdx = q.shuffledOptions[userChoice].originalIndex;
  const isCorrect = chosenOriginalIdx === q.correct;
  const box = document.getElementById('explanationBox');
  const correctLetter = ['A','B','C','D'][q.shuffledOptions.findIndex(o => o.originalIndex === q.correct)];

  box.innerHTML = `
    <div class="explanation ${isCorrect ? 'correct' : 'wrong'}">
      <h3 class="${isCorrect ? 'correct' : 'wrong'}">
        ${isCorrect ? '✓ Risposta corretta!' : '✗ Risposta errata'}
      </h3>
      ${!isCorrect ? `<p style="margin-bottom:10px"><strong>La risposta corretta è: ${correctLetter}</strong></p>` : ''}
      <p>${q.explanation}</p>
    </div>
  `;
}

function renderResults() {
  let correctCount = 0;
  state.questions.forEach((q, i) => {
    const userAns = state.answers[i];
    if (userAns !== undefined) {
      const chosenOrig = q.shuffledOptions[userAns].originalIndex;
      if (chosenOrig === q.correct) correctCount++;
    }
  });
  const total = state.totalQuestions;
  const pct = Math.round((correctCount / total) * 100);
  const passed = pct >= 65;
  const elapsed = Math.round((Date.now() - state.startTime) / 60000);

  let reviewHtml = '<div class="review-list"><h3 style="margin-bottom:10px;color:#1e3c72">Riepilogo domande</h3>';
  state.questions.forEach((q, i) => {
    const userAns = state.answers[i];
    const answered = userAns !== undefined;
    const chosenOrig = answered ? q.shuffledOptions[userAns].originalIndex : -1;
    const isCorrect = chosenOrig === q.correct;
    reviewHtml += `
      <div class="review-item ${answered ? (isCorrect ? 'correct-row' : 'wrong-row') : ''}">
        <div class="q-title">#${q.id} ${isCorrect ? '✓' : (answered ? '✗' : '—')} ${q.q.substring(0, 90)}${q.q.length > 90 ? '...' : ''}</div>
      </div>
    `;
  });
  reviewHtml += '</div>';

  app.innerHTML = `
    <div class="results">
      <h2>Quiz completato!</h2>
      <div class="score-circle">
        <div class="score-number">${correctCount}/${total}</div>
        <div class="score-total">risposte corrette</div>
      </div>
      <div class="score-pct">${pct}%</div>
      <div class="verdict ${passed ? 'pass' : 'fail'}">
        ${passed ? '🎉 Complimenti! Hai superato la soglia del 65%' : '📚 Sotto la soglia del 65% — continua a studiare!'}
        <br><small>Tempo impiegato: ${elapsed} minuti</small>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="restartBtn">Nuovo Quiz</button>
        <button class="btn btn-secondary" id="reviewBtn">Rivedi risposte</button>
      </div>
      ${reviewHtml}
    </div>
  `;

  document.getElementById('restartBtn').onclick = renderStart;
  document.getElementById('reviewBtn').onclick = () => {
    state.current = 0;
    renderQuestion();
  };
}

// START
renderStart();
</script>
</body>
</html>
